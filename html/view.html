<!-- ===================================================================
     MyPoems · 作品总览 (view.html)
     =================================================================== -->

<header class="page-head">
    <span class="seal page-head__seal" aria-hidden="true">览</span>
    <div class="page-head__text">
        <h2 class="page-title">作品总览</h2>
        <p class="page-subtitle">搜检旧作 · 点击卡片于右侧展卷</p>
    </div>
</header>

<section id="controls" aria-label="检索与筛选">
    <div class="search-bar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="search-icon" aria-hidden="true">
            <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
        </svg>
        <input type="search" id="search-input" placeholder="在标题或正文中搜索…" aria-label="搜索作品" autocomplete="off">
    </div>

    <button type="button" id="mobile-filter-toggle" class="btn btn--secondary">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5h18v2H3V5zm3 6h12v2H6v-2zm3 6h6v2H9v-2z"/></svg>
        <span>展开筛选</span>
    </button>

    <div id="filters" role="group" aria-label="筛选条件">
        <div class="filter-row">
            <div class="filter-group">
                <strong>创作年份</strong>
                <div id="year-filters"></div>
            </div>
        </div>

        <div class="filter-row">
            <div class="filter-group">
                <strong>创作月份</strong>
                <div id="month-filters"></div>
            </div>
        </div>

        <div class="filter-row">
            <div class="filter-group" id="type-filters-container">
                <strong>类型</strong>
                <div id="type-filters"></div>
            </div>
        </div>

        <div class="filter-row">
            <div class="filter-group" id="genre-filters-container" style="display: none;">
                <strong>体裁</strong>
                <div id="genre-filters"></div>
            </div>
        </div>

        <div class="filter-row">
            <div class="filter-group" id="tag-filters-container">
                <strong>标签</strong>
                <div id="tag-filters"></div>
            </div>
        </div>
    </div>

    <div id="poem-counter" aria-live="polite"></div>
</section>

<div id="poems-list" class="poem-grid-layout"></div>
