<!-- ===================================================================
     MyPoems · 编年史 (timeline.html)
     年表全景轴 + 逐年切片（同比 / 月度 / 沉默 / 新主题 / 意象联动）
     =================================================================== -->

<header class="page-head">
    <span class="seal page-head__seal" aria-hidden="true">纪</span>
    <div class="page-head__text">
        <h2 class="page-title">编年史</h2>
        <p class="page-subtitle">岁月留痕 · 点年卡展开当年篇目，点意象可跳转意象簿</p>
    </div>
</header>

<!-- ============ 年表全景轴 ============ -->
<section class="tl-overview" id="tl-overview" aria-label="年表总览">
    <div class="tl-overview__head">
        <div class="tl-overview__totals" id="tl-totals"></div>
        <div class="tl-overview__span" id="tl-span"></div>
    </div>
    <div class="tl-spark" id="tl-spark" role="group" aria-label="逐年篇数，点击跳转对应年份"></div>
</section>

<div class="timeline-wrapper">
    <nav id="timeline-year-nav" class="timeline-year-nav" aria-label="年份快捷跳转"></nav>

    <div class="timeline-column">
        <div class="timeline-start-node">
            <span>今</span>
            <span class="timeline-node-label" id="tl-node-now"></span>
        </div>

        <div id="timeline-container" class="main-timeline"></div>

        <div class="timeline-end-node">
            <span>始</span>
            <span class="timeline-node-label" id="tl-node-start"></span>
        </div>
    </div>
</div>
