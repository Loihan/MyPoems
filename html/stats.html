<!-- ===================================================================
     MyPoems · 笔耕录 (stats.html)
     全期聚合画像：总量 / 累计字数 / 创作节律 / 篇长分布 / 月份偏好 / 之最 / 词牌标签
     （逐年趋势已移交编年史，这里只做"跨年"的聚合与排行）
     =================================================================== -->

<header class="page-head">
    <span class="seal page-head__seal" aria-hidden="true">耕</span>
    <div class="page-head__text">
        <h2 class="page-title">笔耕录</h2>
        <p class="page-subtitle">日积月累 · 全期画像与排行，逐年编年请看「编年史」</p>
    </div>
</header>

<!-- 1. 全期总量 -->
<div class="stats-overview">
    <div class="stat-card">
        <div class="stat-icon purple">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        </div>
        <div class="stat-info">
            <span class="stat-value" id="stat-total-poems">0</span>
            <span class="stat-label">作品总数</span>
        </div>
    </div>

    <div class="stat-card">
        <div class="stat-icon green">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        </div>
        <div class="stat-info">
            <span class="stat-value" id="stat-total-chars">0</span>
            <span class="stat-label">累计字数</span>
        </div>
    </div>

    <div class="stat-card">
        <div class="stat-icon blue">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14v10zM7 12h5v5H7v-5z"/></svg>
        </div>
        <div class="stat-info">
            <span class="stat-value" id="stat-active-days">0</span>
            <span class="stat-label">动笔天数</span>
        </div>
    </div>

    <div class="stat-card">
        <div class="stat-icon gold">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </div>
        <div class="stat-info">
            <span class="stat-value" id="stat-avg-len">0</span>
            <span class="stat-label">平均篇长（字）</span>
        </div>
    </div>
</div>

<!-- 2. 累计字数曲线（替代原来的逐年柱状图，逐年趋势已归编年史） -->
<section class="chart-section">
    <h3 class="section-title">笔耕不辍 · 累计字数</h3>
    <div class="trend-chart-container"><canvas id="cumulative-chart"></canvas></div>
    <p class="chart-note" id="cumulative-note"></p>
</section>

<!-- 3. 篇长分布 + 月份偏好 -->
<div class="stats-two-col">
    <section class="chart-section">
        <h3 class="section-title">篇长分布</h3>
        <div class="trend-chart-container"><canvas id="length-chart"></canvas></div>
        <p class="chart-note" id="length-note"></p>
    </section>

    <section class="chart-section">
        <h3 class="section-title">全期月份偏好</h3>
        <div class="month-bars" id="month-bars"></div>
        <p class="chart-note" id="month-note"></p>
    </section>
</div>

<!-- 4. 创作节律 -->
<section class="chart-section">
    <h3 class="section-title">创作节律</h3>
    <div class="rhythm-grid" id="rhythm-grid"></div>
</section>

<!-- 5. 体裁分布（点击跳作品总览筛选） -->
<section class="chart-section">
    <h3 class="section-title">体裁分布 <span class="section-hint">点击可跳到作品总览筛选</span></h3>
    <div id="type-distribution" class="type-distribution-bar"></div>
</section>

<!-- 6. 创作之最 -->
<section class="chart-section">
    <h3 class="section-title">创作之最</h3>
    <div id="records-grid" class="records-grid"></div>
</section>

<!-- 7. 词牌与主题（点击跳作品总览筛选） -->
<div class="stats-two-col">
    <section class="chart-section">
        <h3 class="section-title">词牌一览</h3>
        <div id="cipai-list" class="chip-cloud"></div>
    </section>
    <section class="chart-section">
        <h3 class="section-title">主题标签</h3>
        <div id="tag-ranking" class="chip-cloud"></div>
    </section>
</div>
