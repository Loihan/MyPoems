<!-- ===================================================================
     MyPoems · 索引管理 (tags.html)
     =================================================================== -->

<header class="page-head">
    <span class="seal page-head__seal" aria-hidden="true">签</span>
    <div class="page-head__text">
        <h2 class="page-title">索引管理</h2>
        <p class="page-subtitle">以类相从 · 可多选标签求交集，或勾选作品批量贴签</p>
    </div>
</header>

<div class="tags-manager-layout">
    <!-- 左栏：标签索引 -->
    <aside class="tags-sidebar" aria-label="标签列表">
        <div class="tags-header">
            <input type="text" id="tag-search" placeholder="搜索标签…" aria-label="搜索标签" autocomplete="off">
        </div>
        <div id="tags-list-container" class="tags-list"></div>
    </aside>

    <!-- 右栏：作品与操作 -->
    <section class="tags-content" aria-label="关联作品">
        <div id="tag-detail-view">
            <div class="tag-detail-header">
                <h3 id="current-view-title">所有作品</h3>

                <div id="tag-actions-area" class="tag-actions" style="display:none;">
                    <button type="button" id="btn-rename-tag" class="action-link edit-action">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg>
                        重命名 / 合并
                    </button>
                    <button type="button" id="btn-delete-tag" class="action-link delete-action">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                        删除标签
                    </button>
                </div>
            </div>

            <div class="tag-list-toolbar">
                <p class="tag-count-hint">列表共 <span id="current-list-count">0</span> 篇</p>
                <button type="button" id="btn-select-all" class="text-btn">全选 / 取消</button>
            </div>

            <div id="related-poems-list" class="related-poems"></div>
        </div>

        <!-- 浮动批量操作栏 -->
        <div id="batch-tag-bar" class="batch-bar">
            <span class="batch-hint">已选 <strong id="batch-selected-count">0</strong> 篇</span>
            <div class="batch-input-group">
                <input type="text" id="batch-add-input" placeholder="输入要添加的标签…" aria-label="批量添加标签" autocomplete="off">
                <button type="button" id="btn-batch-add" class="btn btn--primary">批量添加</button>
            </div>
        </div>
    </section>
</div>
