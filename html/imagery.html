<!-- ===================================================================
     MyPoems · 意象簿 (imagery.html)
     =================================================================== -->

<header class="page-head">
    <span class="seal page-head__seal" aria-hidden="true">象</span>
    <div class="page-head__text">
        <h2 class="page-title">意象簿</h2>
        <p class="page-subtitle">字里乾坤 · 统计正文高频字词（含双字词）</p>
    </div>
</header>

<div class="imagery-layout">
    <div class="imagery-header">
        <div class="header-intro">
            <p>高频词云 · Top 50</p>
            <span class="sub-text">点击词汇，展读历年用例</span>
        </div>
        <button type="button" id="btn-manage-ignore" class="btn btn--secondary btn--sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            管理屏蔽词
        </button>
    </div>

    <div id="imagery-content-wrapper" class="imagery-content-wrapper">
        <div id="word-rank-list" class="word-rank-grid">
            <div class="loading-placeholder"><span class="ink-spinner"></span>正在研墨分析…</div>
        </div>

        <div id="imagery-detail-panel" class="imagery-detail-panel">
            <button type="button" id="close-detail-btn" class="panel-close-btn" title="关闭详情" aria-label="关闭详情">&times;</button>

            <div class="detail-content-scroll">
                <div class="detail-section tianzi-section">
                    <div id="tianzi-wrapper" class="tianzi-wrapper"></div>
                </div>

                <div class="detail-section chart-section-inner">
                    <div class="chart-wrapper">
                        <h5 class="chart-title">年度出现频次</h5>
                        <div class="chart-container"><canvas id="usage-chart"></canvas></div>
                    </div>

                    <div class="chart-wrapper">
                        <h5 class="chart-title">年度创作占比（%）</h5>
                        <div class="chart-container"><canvas id="ratio-chart"></canvas></div>
                    </div>
                </div>

                <div id="chart-poems-list" class="chart-poems-list" style="display:none;">
                    <h4><span id="selected-year-label"></span> 年 · 含「<span id="selected-word-label"></span>」之作</h4>
                    <div id="poems-result-container" class="poems-result-grid"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 屏蔽词浮层 -->
<div id="ignore-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="ignore-modal-title">
    <div class="modal-content modal--sm">
        <button type="button" id="close-ignore-btn" class="modal-close-btn" aria-label="关闭">&times;</button>
        <h3 id="ignore-modal-title">屏蔽词管理</h3>
        <p class="form-hint">被屏蔽的字词不会出现在高频统计中（如「之」「乎」「者」「也」）。</p>
        <div class="ignore-input-group">
            <input type="text" id="ignore-input" placeholder="输入词汇，回车添加…" aria-label="新增屏蔽词" autocomplete="off">
            <button type="button" id="btn-add-ignore" class="btn btn--primary">添加</button>
        </div>
        <div id="ignore-tags-container" class="ignore-tags-cloud"></div>
    </div>
</div>
