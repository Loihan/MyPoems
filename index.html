<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="我的诗词集 · 个人数字书斋">
    <title>詩詞集 · MyPoems</title>
    <link rel="icon" href="logo.ico">

    <script>document.documentElement.classList.remove('no-js');</script>
    <script src="js/vendor/chart.umd.js"></script>

    <!-- 样式（顺序即层叠顺序） -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <!-- 首屏引导：在第一次绘制前套用已保存的外观与阅读方式，避免闪白/跳动 -->
    <script>
    (function () {
        try {
            var store = window.localStorage;
            var choice = store.getItem('mypoems-theme') || 'paper';
            if (choice === 'light') choice = 'paper';
            if (choice === 'dark') choice = 'inknight';
            var resolved = choice === 'auto'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'inknight' : 'paper')
                : choice;
            document.body.dataset.theme = resolved;
            if (store.getItem('mypoems-theme-dark') === '1' ||
                (choice === 'auto' && resolved === 'inknight')) {
                document.body.classList.add('dark-theme');
            }
            document.body.dataset.reader = store.getItem('mypoems-reader-mode') === 'modal' ? 'modal' : 'push';
        } catch (e) {
            document.body.dataset.theme = 'paper';
            document.body.dataset.reader = 'push';
        }
    })();
    </script>

    <a class="skip-link" href="#content">跳到正文</a>

    <div class="app">
        <!-- ============ 左侧书签栏 ============ -->
        <aside class="rail" id="rail" aria-label="书签栏">
            <div class="rail__brand">
                <span class="seal seal--lg" aria-hidden="true">詩</span>
                <span class="rail__brand-text">
                    <span class="rail__brand-title">詩詞集</span>
                    <span class="rail__brand-sub">My Poems</span>
                </span>
            </div>

            <nav class="rail__nav" aria-label="主菜单">
                <p class="rail-nav__label">卷帙</p>
                <ul class="rail-nav">
                    <li>
                        <a href="#view" data-page="view" data-title="作品总览">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C9.5 2 7.5 3 6 4.2 4.5 3 2.5 2 0 2v17c2.5 0 4.5 1 6 2.2 1.5-1.2 3.5-2.2 6-2.2s4.5 1 6 2.2c1.5-1.2 3.5-2.2 6-2.2V2c-2.5 0-4.5 1-6 2.2C16.5 3 14.5 2 12 2zm0 2.2c1.8 0 3.3.7 4.5 1.6v12.4c-1.2-.7-2.7-1.1-4.5-1.2V4.2z"/></svg>
                            <span>作品总览</span>
                        </a>
                    </li>
                    <li>
                        <a href="#add" data-page="add" data-title="添加新篇">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 5.6 18.4 3.3a1 1 0 0 0-1.4 0l-1.9 1.9 3.8 3.7 1.8-1.8a1 1 0 0 0 0-1.5zM3 17.3V21h3.8L17.8 9.9l-3.7-3.7L3 17.3z"/></svg>
                            <span>添加新篇</span>
                        </a>
                    </li>
                    <li>
                        <a href="#manage" data-page="manage" data-title="作品管理">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v2H3V5zm0 6h18v2H3v-2zm0 6h12v2H3v-2zM17 15l4 3-4 3v-6z"/></svg>
                            <span>作品管理</span>
                        </a>
                    </li>
                    <li>
                        <a href="#tags" data-page="tags" data-title="索引管理">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.9 2.1 4.1 8.9a2 2 0 0 0 0 2.8l8.8 8.8a2 2 0 0 0 2.8 0l6.8-6.8a2 2 0 0 0 .6-1.4V4a2 2 0 0 0-2-2h-8.2a2 2 0 0 0-1 .1zM17.5 8a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
                            <span>索引管理</span>
                        </a>
                    </li>
                    <li>
                        <a href="#timeline" data-page="timeline" data-title="编年史">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3a9 9 0 1 0 8.5 6H19a7 7 0 1 1-6-4V8h6V2h-2v2.1A8.9 8.9 0 0 0 13 3zm-1 4v6l5 3 1-1.7-4-2.3V7h-2z"/></svg>
                            <span>编年史</span>
                        </a>
                    </li>
                    <li>
                        <a href="#quotes" data-page="quotes" data-title="精句集">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7H4v6h3l-2 4h2l2-4V7H7zm9 0h-3v6h3l-2 4h2l2-4V7h-2z"/></svg>
                            <span>精句集</span>
                        </a>
                    </li>
                    <li>
                        <a href="#imagery" data-page="imagery" data-title="意象簿">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C5 5 2 12 2 12s3 7 10 7 10-7 10-7-3-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
                            <span>意象簿</span>
                        </a>
                    </li>
                    <li>
                        <a href="#stats" data-page="stats" data-title="笔耕录">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h3V10H4v10zm6.5 0h3V4h-3v16zM17 20h3v-7h-3v7z"/></svg>
                            <span>笔耕录</span>
                        </a>
                    </li>
                    <li>
                        <a href="#settings" data-page="settings" data-title="设置">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.8 7.8 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.7l-2-3.4a.5.5 0 0 0-.6-.2l-2.5 1a7.6 7.6 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6c-.6.2-1.2.6-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.4a.5.5 0 0 0 .1.7L4.6 11a7.8 7.8 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.7l2 3.4c.1.2.4.3.6.2l2.5-1c.5.4 1.1.8 1.7 1l.4 2.6c0 .2.2.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.6c.6-.2 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.4a.5.5 0 0 0-.1-.7L19.4 13zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
                            <span>设置</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div id="daily-quote-container" class="rail__quote" role="button" tabindex="0" aria-label="今日精句" hidden></div>

            <div class="rail__foot">
                <button type="button" id="rail-collapse-btn" class="icon-btn" aria-label="收起书签栏" aria-pressed="false" data-tip="收起 / 展开">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/><path d="M19.4 7.4 18 6l-6 6 6 6 1.4-1.4L14.8 12z"/></svg>
                </button>
            </div>
        </aside>

        <div class="scrim scrim--rail" id="rail-scrim"></div>

        <!-- ============ 内容台 ============ -->
        <div class="stage">
            <header class="topbar">
                <button type="button" class="icon-btn rail-toggle" id="rail-toggle" aria-label="打开导航" aria-expanded="false" aria-controls="rail">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
                </button>
                <div class="topbar__title">
                    <span class="topbar-page" id="topbar-page">作品总览</span>
                    <span class="topbar__hint" id="topbar-hint">展卷 · 一览旧作</span>
                </div>
                <div class="topbar__actions">
                    <button type="button" class="icon-btn" id="topbar-search-btn" aria-label="搜索" data-tip="搜索" data-tip-pos="bottom">
                        <svg viewBox="0 0 20 20" aria-hidden="true"><path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11zM2 9a7 7 0 1 1 12.45 4.39l3.33 3.33a1 1 0 0 1-1.42 1.41l-3.32-3.33A7 7 0 0 1 2 9z" clip-rule="evenodd"/></svg>
                    </button>
                </div>
            </header>

            <main id="content" class="content" tabindex="-1">
                <div class="loading-placeholder"><span class="ink-spinner"></span>正在展卷…</div>
            </main>
        </div>

        <!-- ============ 右侧阅览抽屉 ============ -->
        <aside id="reading-panel" class="reader" aria-label="作品详情" aria-hidden="true">
            <div class="reader__head">
                <span class="reader__head-label">阅览</span>
                <span class="spacer"></span>
                <button type="button" id="reader-layout-btn" class="icon-btn" aria-label="切换竖排/横排" data-tip="竖排 / 横排" data-tip-pos="bottom">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h4v18H5V3zm8 0h2v18h-2V3zm4 0h2v18h-2V3z"/></svg>
                </button>
                <button type="button" id="reader-copy-btn" class="icon-btn" aria-label="复制全文" data-tip="复制全文" data-tip-pos="bottom">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
                </button>
                <button type="button" id="close-panel-btn" class="icon-btn" aria-label="关闭详情" data-tip="关闭 (Esc)" data-tip-pos="bottom">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg>
                </button>
            </div>
            <div id="panel-content-area" class="reader__body"></div>
        </aside>

        <div class="scrim scrim--reader" id="reader-scrim"></div>
    </div>

    <div id="notification" class="toast-stack" role="status" aria-live="polite"></div>

    <script src="js/seed-data.js"></script>
    <script src="js/db-mock.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
